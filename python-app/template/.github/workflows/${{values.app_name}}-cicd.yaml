
name: ${{ values.app_name }}-cicd

on:
  push:
    paths:
      - src/**
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Shorten commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ '${{ secrets.DOCKERHUB_USERNAME }}' }}
          password: ${{ '${{ secrets.DOCKERHUB_TOKEN }}' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: priti081294/${{ values.app_name }}:${{ '${{ env.COMMIT_ID }}' }}

    outputs:
      commit_id: ${{ '${{ env.COMMIT_ID }}' }}

  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        shell: bash
        run: |
          ARCH=$(uname -m)

          case "$ARCH" in
            x86_64)
              YQ_ARCH=amd64
              ;;
            aarch64|arm64)
              YQ_ARCH=arm64
              ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          sudo curl -L -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH}"

          sudo chmod +x /usr/local/bin/yq

          yq --version

      - name: Modify values file
        shell: bash
        run: |
          echo "${{ '${{ needs.ci.outputs.commit_id }}' }}"

          yq e '.image.tag = "${{ '${{ needs.ci.outputs.commit_id }}' }}"' \
            -i charts/${{ values.app_name }}/values-${{ values.app_env }}.yaml

          echo "Updated image tag:"

          yq e '.image.tag' \
            charts/${{ values.app_name }}/values-${{ values.app_env }}.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Updates values.yaml with commit ${{ '${{ needs.ci.outputs.commit_id }}' }}"

      - name: Install Argo CD CLI
        shell: bash
        run: |
          if ! command -v argocd >/dev/null 2>&1; then
            ARCH=$(uname -m)

            case "$ARCH" in
              x86_64)
                ARGO_ARCH=amd64
                ;;
              aarch64|arm64)
                ARGO_ARCH=arm64
                ;;
              *)
                echo "Unsupported architecture: $ARCH"
                exit 1
                ;;
            esac

            curl -sSL -o argocd \
              "https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-${ARGO_ARCH}"

            chmod +x argocd

            sudo mv argocd /usr/local/bin/argocd
          fi

          argocd version --client

      - name: Argo CD login
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password "${{ '${{ secrets.ARGOCD_PASSWORD }}' }}"

      - name: Ensure Argo CD repo and app
        shell: bash
        run: |
          repo="https://github.com/python-devops-demo/${{ values.app_name }}.git"

          # Connects the Argo CD repository
          if ! argocd repo list | grep -q "$repo"; then
            argocd repo add "$repo"
          fi

          # Creates the Argo CD application if it does not exist
          if ! argocd app get "${{ values.app_name }}" >/dev/nul_

