name: ${{values.app_name}}-cicd

on:
  push:
    paths:
      - src/**
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Shorten commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ '${{ secrets.DOCKERHUB_USERNAME }}' }}
          password: ${{ '${{ secrets.DOCKERHUB_TOKEN }}' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: priti081294/${{values.app_name}}:${{ '${{ env.COMMIT_ID }}' }}

    outputs:
      commit_id: ${{ '${{ env.COMMIT_ID }}' }}

  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Modify values file
        shell: bash
        run: |
          echo "Commit ID: ${{ '${{needs.ci.outputs.commit_id}}' }}"

          echo "Installing yq..."

          sudo curl -L \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_arm64 \
            -o /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq

          echo "Checking yq version..."
          yq --version

          echo "Updating image tag..."

          yq -Yi '.image.tag = "${{'${{needs.ci.outputs.commit_id}}' }}"' \
            charts/${{values.app_name}}/values-${{values.app_env}}.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Updates values.yaml with commit ${{ '${{needs.ci.outputs.commit_id}}' }}'

      - name: Install argocd
        shell: bash
        run: |
          echo "Installing Argo CD CLI..."

          curl -ksSL \
            -o argocd \
            https://argocd-server.argocd/download/argocd-linux-arm64

          chmod +x argocd

          sudo mv ./argocd /usr/local/bin/argocd

          echo "Checking Argo CD version..."
          argocd version --client

      - name: ArgoCD login
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ '${{ secrets.ARGOCD_PASSWORD }}' }}

      - name: Ensure ArgoCD repo and app
        shell: bash
        run: |
          # Connects the ArgoCD repo
          repo="https://github.com/priti-devops-org/${{values.app_name}}.git"

          argocd repo list | grep -q "$repo" || argocd repo add "$repo"

          # Creates the ArgoCD app
          argocd app get ${{values.app_name}} || argocd app create ${{values.app_name}} \
            --repo "$repo" \
            --path charts/${{values.app_name}} \
            --dest-namespace ${{values.app_env}} \
            --dest-server https://kubernetes.default.svc \
            --values values-${{values.app_env}}.yaml \
            --revision master \
            --sync-policy manual \
            --sync-option CreateNamespace=true

      - name: ArgoCD app sync
        shell: bash
        run: |
          argocd app sync ${{values.app_name}}

          argocd app wait ${{values.app_name}} --timeout 180