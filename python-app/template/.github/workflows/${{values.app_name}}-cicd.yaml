name: ${{ values.app_name }}-cicd

on:
  push:
    paths:
      - src/**
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Shorten commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ '${{ secrets.DOCKERHUB_USERNAME }}' }}
          password: ${{ '${{ secrets.DOCKERHUB_TOKEN }}' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: priti08124/${{ values.app_name }}:${{ '${{ env.COMMIT_ID }}' }}

    outputs:
      commit_id: ${{ '${{ env.COMMIT_ID }}' }}

  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Modify values file
        shell: bash
        run: |
          echo "${{ '${{ needs.ci.outputs.commit_id }}' }}"

          yq -Yi '.image.tag = "${{ '${{ needs.ci.outputs.commit_id }}' }}"' \
            charts/${{ values.app_name }}/values-${{ values.app_env }}.yaml

          echo "Updated image tag:"
          yq '.image.tag' \
            charts/${{ values.app_name }}/values-${{ values.app_env }}.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Updates values.yaml with commit ${{ '${{ needs.ci.outputs.commit_id }}' }}"

      - name: Install Argo CD CLI
        shell: bash
        run: |
          if ! command -v argocd >/dev/null 2>&1; then
            brew install argocd
          fi

          argocd version --client

      - name: Argo CD login
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password "${{ '${{ secrets.ARGOCD_PASSWORD }}' }}"

      - name: Ensure Argo CD repo and app
        shell: bash
        run: |
          repo="https://github.com/python-devops-demo/${{ values.app_name }}.git"

          # Connects the Argo CD repository
          if ! argocd repo list | grep -q "$repo"; then
            argocd repo add "$repo"
          fi

          # Creates the Argo CD application if it does not exist
          if ! argocd app get "${{ values.app_name }}" >/dev/null 2>&1; then
            argocd app create "${{ values.app_name }}" \
              --repo "$repo" \
              --path "charts/${{ values.app_name }}" \
              --dest-namespace "${{ values.app_env }}" \
              --dest-server "https://kubernetes.default.svc" \
              --values "values-${{ values.app_env }}.yaml" \
              --revision master \
              --sync-policy manual \
              --sync-option CreateNamespace=true
          fi

      - name: Argo CD app sync
        shell: bash
        run: |
          argocd app sync "${{ values.app_name }}"
          argocd app wait "${{ values.app_name }}" --timeout 180

